name: Import independent project snapshot
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-snapshot.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-snapshot-import
  cancel-in-progress: false
jobs:
  copy:
    if: github.repository == 'keshavchauhan15482-byte/hack2skill'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read original snapshot without writing to it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = "https://github.com/keshavchauhan15482-byte/hack2skill"
          test ! -f garuda_v3/sensor_runner.py || { echo "Project already imported; refusing to overwrite."; exit 1; }
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          git -C "$RUNNER_TEMP/source-snapshot" init -q
          git -C "$RUNNER_TEMP/source-snapshot" fetch --depth=1 https://github.com/keshavchauhan15482-byte/defencekrishna.git 8c8376489b0ff9f40a5f60367be6af8c164b6f7e
          git -C "$RUNNER_TEMP/source-snapshot" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/source-snapshot" rev-parse HEAD)" = "8c8376489b0ff9f40a5f60367be6af8c164b6f7e"
          rm -rf "$RUNNER_TEMP/source-snapshot/.git"
      - name: Remove competition branding and isolate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/source-snapshot" <<'PY'
          from pathlib import Path
          import hashlib, re, shutil, sys
          root=Path(sys.argv[1])
          for name in ('sih_submission','console_preview'):
              p=root/name
              if p.is_dir(): shutil.rmtree(p)
          workflows=root/'.github/workflows'
          if workflows.exists():
              workflows.rename(root/'.github/workflow-templates')
          patterns=[
              (r'(?i)smart[ _-]+india[ _-]+hackathon(?:[ _-]+20\d{2})?', 'Independent Project Showcase'),
              (r'(?i)national[ _-]+technical[ _-]+research[ _-]+organi[sz]ation','network research'),
              (r'(?i)ntro-world-model','network-world-model'),
              (r'(?i)sih[ _-]*26153','PROJECT'),
              (r'(?i)\b(?:ps|problem[ _-]+statement)[ _-]*26153\b','project objective'),
              (r'(?i)(?<![A-Za-z0-9])sih(?![A-Za-z0-9])','project'),
              (r'(?i)(?<![A-Za-z0-9])ntro(?![A-Za-z0-9])','network_research'),
          ]
          def replace(s):
              for pattern,replacement in patterns:
                  if replacement in ('project','network_research'):
                      s=re.sub(pattern,lambda m:replacement.upper() if m.group().isupper() else replacement.capitalize() if m.group().istitle() else replacement,s)
                  else:
                      s=re.sub(pattern,replacement,s)
              return s
          cloud={
              'krishna-defence-system.vercel.app':'your-vercel-project.example',
              'krishna-shadow-telemetry.onrender.com':'your-render-service.example',
              'krishna-shadow-telemetry':'hack2skill-shadow-telemetry',
              'krishna-live-telemetry':'hack2skill-live-telemetry',
              'keshavchauhan15482-byte/defencekrishna':'keshavchauhan15482-byte/hack2skill',
              'defencekrishna-main':'hack2skill-main',
              'cd defencekrishna':'cd hack2skill',
          }
          immutable={'.pcap','.pcapng','.pt','.pth','.npz','.npy','.pkl','.pickle','.bin','.onnx','.safetensors','.gz','.zip','.pdf','.pptx','.png','.jpg','.jpeg','.gif','.parquet','.feather'}
          old=re.compile(r'(?i)smart[ _-]+india[ _-]+hackathon|sih[ _-]*26153|(?<![A-Za-z0-9])(?:sih|ntro)(?![A-Za-z0-9])|national[ _-]+technical[ _-]+research[ _-]+organi[sz]ation')
          removed=re.compile(r'(?i)(?:sih_submission|console_preview[/\\])')
          changed=renamed=preserved=0
          leftovers=[]
          for p in sorted(root.rglob('*'), key=lambda p:len(p.parts), reverse=True):
              if p.is_symlink(): raise SystemExit('Unexpected symlink: '+str(p.relative_to(root)))
              if p.is_file():
                  rel=p.relative_to(root)
                  raw=p.read_bytes()
                  dataset_csv=p.suffix.lower()=='.csv' and ('datasets' in rel.parts or 'cicids2018_data' in rel.parts or 'sample_cicids2018' in p.name)
                  if p.suffix.lower() in immutable or '.pcap.part_' in p.name or b'\0' in raw[:8192] or dataset_csv:
                      preserved+=1
                  else:
                      try: src=raw.decode('utf-8')
                      except UnicodeDecodeError: preserved+=1
                      else:
                          dst=src
                          if p.suffix.lower() in ('.md','.rst'):
                              dst=''.join(l for l in dst.splitlines(keepends=True) if not removed.search(l))
                          dst=replace(dst)
                          dst=dst.replace('PROJECT / PREDICTIVE CYBER DEFENCE','PREDICTIVE CYBER DEFENCE')
                          dst=re.sub(r'(?i)\bthe problem statement requires\b','The project uses',dst)
                          dst=re.sub(r'(?i)\bproblem statement\b','project objective',dst)
                          for a,b in cloud.items(): dst=dst.replace(a,b)
                          if dst!=src: p.write_bytes(dst.encode('utf-8')); changed+=1
                          if old.search(dst): leftovers.append(str(rel))
              name=replace(p.name)
              if name!=p.name:
                  target=p.with_name(name)
                  if target.exists(): raise SystemExit('Rename collision: '+str(target))
                  p.rename(target);renamed+=1
          leftovers.extend(str(p.relative_to(root)) for p in root.rglob('*') if old.search(str(p.relative_to(root))))
          if leftovers: raise SystemExit('Unclean text/path references: '+repr(leftovers[:30]))
          with (root/'README.md').open('a',encoding='utf-8') as f:
              f.write('\n\n## Independent project configuration\n\n'
                      'This is an independently configured snapshot of the existing Krishna Defence System codebase. '
                      'Prior experimental evidence is preserved, not claimed as a new reproduction. '
                      'Cloud endpoints are intentionally nonfunctional examples; configure separate Vercel, Render, '
                      'PostgreSQL and independent tokens before enabling hosted telemetry. '
                      'The previous production deployment is not shared. Garuda remains advisory. '
                      'CI workflow templates are preserved in .github/workflow-templates; review and enable them separately. '
                      'No historical submission slides or screenshots are included.\n')
          print(f'Rebranding complete: {changed} edited text files, {renamed} renamed paths, {preserved} preserved binary/data files.')
          for p in ['console.html','api/security-check.js','garuda_v3/sensor_runner.py','network-world-model','deployment/vercel/defence_gate.js']:
              assert (root/p).exists(),p
          PY
      - name: Copy snapshot into only this repository
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "keshavchauhan15482-byte/hack2skill"
          rsync -a --exclude='.git' "$RUNNER_TEMP/source-snapshot/" "$GITHUB_WORKSPACE/"
          git add -f --all
          git diff --cached --stat | tail -n 3
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import independent Krishna Defence System snapshot"
          git push origin HEAD:refs/heads/main
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          printf 'Verified target commit: %s\n' "$(git rev-parse HEAD)"
          printf 'Tracked files: %s\n' "$(git ls-files | wc -l)"
